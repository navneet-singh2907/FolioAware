name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lock and install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag folio-aware:test .

      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id folio-aware:test -u)" != "0"

      - name: Smoke test health endpoint
        run: |
          docker run --detach --name folio-aware-smoke --publish 8080:8080 folio-aware:test
          trap 'docker rm --force folio-aware-smoke' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs folio-aware-smoke
          exit 1

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=deploy/terraform fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform -chdir=deploy/terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform -chdir=deploy/terraform validate

      - name: Run offline infrastructure tests
        run: terraform -chdir=deploy/terraform test
